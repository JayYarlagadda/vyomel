<!DOCTYPE html>
<html lang="en">
  <head><title>Application Form</title></head>
  <body>
    <form>
      <label>Name <input type="text" name="name" aria-label="Full name" /></label>
      <label>Role
        <select name="role" aria-label="Role">
          <option value="backend">Backend</option>
          <option value="frontend">Frontend</option>
        </select>
      </label>
      <input type="password" name="password" aria-label="Password" />
      <button type="submit" aria-label="Submit application" data-submit="true">Submit application</button>
    </form>
  </body>
</html>
