# Default values for the Vyomel control-plane chart (docs/02 §7, M13).
# Desktop tools stay off-cluster — see ADR-0009 and templates/NOTES.txt.

nameOverride: ""
fullnameOverride: "vyomel"

image:
  repository: vyomel
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

# Shared app config (non-secret).
config:
  env: prod
  logFormat: json
  logLevel: INFO
  embedScheduler: "false"
  disableHostTools: "true"
  localAgentToken: "" # override via secret
  plannerBackend: mock
  offline: "false"

secret:
  create: true
  # Used when secret.create=true. Prefer --set-file / external secrets in prod.
  postgresPassword: vyomel
  apiToken: ""
  localAgentToken: "dev-local-agent-token"
  openaiApiKey: ""
  hfToken: ""

postgres:
  enabled: true
  image: pgvector/pgvector:pg17
  user: vyomel
  database: vyomel
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    # Use a subdirectory so PVC mounts do not break postgres initdb.
    pgdata: /var/lib/postgresql/data/pgdata
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

redis:
  enabled: true
  image: redis:7-alpine
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

api:
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8080

worker:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 8
    # Queue-depth target. Requires a metrics adapter that exports
    # vyomel_queue_depth (Prometheus Adapter / KEDA). For kind smoke tests
    # set worker.hpa.enabled=false.
    targetQueueDepth: 32
    # Fallback CPU target used when external metrics are unavailable.
    targetCPUUtilization: 70

scheduler:
  replicas: 2 # >1 is safe: Redis leader election elects one active ticker
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  leader:
    lockKey: vyomel:scheduler:leader
    ttlSeconds: 15

vllm:
  enabled: false
  image: vllm/vllm-openai:v0.6.3
  model: meta-llama/Meta-Llama-3.1-8B-Instruct
  persistence:
    size: 40Gi
  resources:
    limits:
      nvidia.com/gpu: 1
      memory: 16Gi
    requests:
      cpu: "4"
      memory: 16Gi
      nvidia.com/gpu: 1
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

ingress:
  enabled: false
  className: ""
  hosts:
    - host: vyomel.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# kind / CI: skip GPU and HPA external metrics.
kind:
  # When true, values-kind.yaml conventions apply via --values.
  profile: false
