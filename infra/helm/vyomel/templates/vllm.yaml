{{- if .Values.vllm.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vyomel.fullname" . }}-vllm-weights
  labels:
    {{- include "vyomel.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.vllm.persistence.size }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vyomel.fullname" . }}-vllm
  labels:
    {{- include "vyomel.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
spec:
  serviceName: {{ include "vyomel.fullname" . }}-vllm
  replicas: 1
  selector:
    matchLabels:
      {{- include "vyomel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vllm
  template:
    metadata:
      labels:
        {{- include "vyomel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vllm
    spec:
      {{- with .Values.vllm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vllm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vllm
          image: {{ .Values.vllm.image }}
          args:
            - "--model"
            - {{ .Values.vllm.model | quote }}
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "8192"
            - "--gpu-memory-utilization"
            - "0.90"
            - "--max-num-seqs"
            - "32"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vyomel.fullname" . }}-secrets
                  key: hf-token
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            {{- toYaml .Values.vllm.resources | nindent 12 }}
          volumeMounts:
            - name: weights
              mountPath: /root/.cache/huggingface
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: {{ include "vyomel.fullname" . }}-vllm-weights
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vyomel.fullname" . }}-vllm
  labels:
    {{- include "vyomel.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
spec:
  selector:
    {{- include "vyomel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
