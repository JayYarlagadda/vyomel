apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vyomel.fullname" . }}-api
  labels:
    {{- include "vyomel.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "vyomel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "vyomel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "vyomel.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "vyomel.postgresHost" . }} 5432; do echo waiting for postgres; sleep 2; done
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "vyomel.fullname" . }}-config
          env:
            - name: VYOMEL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vyomel.fullname" . }}-secrets
                  key: database-url
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "vyomel.fullname" . }}-config
          env:
            - name: VYOMEL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vyomel.fullname" . }}-secrets
                  key: database-url
            - name: VYOMEL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vyomel.fullname" . }}-secrets
                  key: api-token
            - name: VYOMEL_LOCAL_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vyomel.fullname" . }}-secrets
                  key: local-agent-token
            - name: VYOMEL_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vyomel.fullname" . }}-secrets
                  key: openai-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /var/vyomel
      volumes:
        - name: workspace
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vyomel.fullname" . }}-api
  labels:
    {{- include "vyomel.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "vyomel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vyomel.fullname" . }}
  labels:
    {{- include "vyomel.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "vyomel.fullname" $ }}-api
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
