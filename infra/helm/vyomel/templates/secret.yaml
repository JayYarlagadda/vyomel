{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vyomel.fullname" . }}-secrets
  labels:
    {{- include "vyomel.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secret.postgresPassword | quote }}
  database-url: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.postgres.user .Values.secret.postgresPassword (include "vyomel.postgresHost" .) .Values.postgres.database | quote }}
  api-token: {{ .Values.secret.apiToken | quote }}
  local-agent-token: {{ .Values.secret.localAgentToken | quote }}
  openai-api-key: {{ .Values.secret.openaiApiKey | quote }}
  hf-token: {{ .Values.secret.hfToken | quote }}
{{- end }}
