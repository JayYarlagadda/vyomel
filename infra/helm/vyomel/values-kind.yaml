# Lightweight profile for kind CI (no GPU, no external-metrics HPA).
vllm:
  enabled: false

worker:
  replicas: 1
  hpa:
    enabled: false

scheduler:
  replicas: 1

api:
  replicas: 1

postgres:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

redis:
  persistence:
    enabled: false

config:
  plannerBackend: mock
  offline: "true"
  embedScheduler: "false"
  disableHostTools: "true"
